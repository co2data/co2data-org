autoInstallPeers: true
excludeLinksFromLockfile: false

# Allow selected packages to run their build scripts (pnpm >= 11: allowBuilds replaces onlyBuiltDependencies)
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
minimumReleaseAgeExclude:
  - '@next/bundle-analyzer@16.4.3'
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
